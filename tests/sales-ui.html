<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Protek Sales UI Test</title>
  <link rel="stylesheet" href="../out/assets/protek-demo.css">
  <link rel="stylesheet" href="../app-live.css">
</head>
<body>
  <div id="app-root"></div>
  <script>
    const customers = [{ id: 10, display_name: "Grupo Moller", legal_name: "Grupo Moller SA de CV", tax_id: "GMO123456AAA", account_code: "GM-01", status: "active" }, { id: 11, display_name: "Taller Norte", legal_name: "Taller Norte SA", tax_id: "TNO123456AAA", account_code: "TN-02", status: "active" }];
    const stages = [
      { id: 1, stage_key: "new", name: "Nueva oportunidad", position: 10, outcome: null, is_closed: false, is_visible: true },
      { id: 2, stage_key: "diagnosis", name: "Diagnóstico", position: 20, outcome: null, is_closed: false, is_visible: true },
      { id: 3, stage_key: "quoted", name: "Oferta enviada", position: 30, outcome: null, is_closed: false, is_visible: true },
      { id: 4, stage_key: "negotiation", name: "Negociación", position: 40, outcome: null, is_closed: false, is_visible: true },
      { id: 5, stage_key: "won", name: "Ganada", position: 50, outcome: "won", is_closed: true, is_visible: true },
      { id: 6, stage_key: "lost", name: "Perdida", position: 60, outcome: "lost", is_closed: true, is_visible: true }
    ];
    const opportunities = [];
    const quotes = [];
    let nextCustomerId = 12;
    let nextQuoteId = 1;
    class Query {
      constructor(table) { this.table = table; }
      select(fields) { if (this.table === "organization_members" && fields.includes("profiles(")) this.relationshipError = true; return this; }
      eq(field, value) { if (field === "id") this.rowId = value; return this; }
      is() { return this; }
      order() { return this; }
      insert(payload) { this.inserted = payload; return this; }
      update(payload) { this.updated = payload; return this; }
      maybeSingle() { return Promise.resolve({ data: this.table === "profiles" ? { display_name: "QA Protek" } : { access_level: "admin" }, error: null }); }
      single() {
        if (this.table === "customers" && this.inserted) {
          const customer = { ...this.inserted, id: nextCustomerId++ };
          customers.push(customer);
          return Promise.resolve({ data: customer, error: null });
        }
        if (this.table === "customers" && this.updated) {
          const customer = customers.find((item) => item.id === this.rowId);
          Object.assign(customer, this.updated);
          return Promise.resolve({ data: { id: customer.id }, error: null });
        }
        if (this.table === "pipeline_stages" && this.updated) {
          const stage = stages.find((item) => item.id === this.rowId);
          Object.assign(stage, this.updated);
          return Promise.resolve({ data: { id: stage.id, name: stage.name, is_visible: stage.is_visible }, error: null });
        }
        return Promise.resolve({ data: { id: 10 }, error: null });
      }
      then(resolve, reject) {
        const data = {
          organization_members: [{ id: 1, organization_id: 1, role: "owner", user_id: "qa", organizations: { id: 1, name: "Taller QA", slug: "taller-qa" } }],
          pipeline_stages: stages,
          organization_member_module_permissions: [{ access_level: "admin" }],
          customers,
          sales_opportunities: opportunities,
          quotes
        }[this.table] || [];
        return Promise.resolve(this.relationshipError ? { data: null, error: new Error("Could not find a relationship between organization_members and profiles") } : { data: Array.isArray(data) ? [...data] : data, error: null }).then(resolve, reject);
      }
    }
    window.supabase = { createClient: () => ({
      auth: { getUser: async () => ({ data: { user: { id: "qa", email: "qa@example.invalid" } } }), onAuthStateChange: () => {}, signOut: async () => {} },
      from: (table) => new Query(table),
      rpc: async (name, args) => {
        if (name === "move_sales_offer_stage") {
          const quote = quotes.find((item) => item.id === args.p_quote_id);
          const opportunity = quote && opportunities.find((item) => item.id === quote.opportunity_id);
          if (!opportunity) return { error: new Error("Offer is not available") };
          opportunity.stage_id = args.p_stage_id;
          return { data: null, error: null };
        }
        if (name === "update_sales_offer") {
          const quote = quotes.find((item) => item.id === args.p_quote_id);
          if (!quote) return { error: new Error("Offer is not available") };
          Object.assign(quote, { customer_id: args.p_customer_id, title: args.p_title, notes: args.p_notes, service_mode: args.p_service_mode, currency_code: args.p_currency_code, subtotal: args.p_subtotal, total_amount: args.p_total_amount, valid_until: args.p_valid_until, updated_at: new Date().toISOString() });
          Object.assign(opportunities.find((item) => item.id === quote.opportunity_id), { customer_id: args.p_customer_id, title: args.p_title, service_mode: args.p_service_mode, estimated_revenue: args.p_total_amount });
          return { data: [{ quote_id: quote.id, quote_number: quote.quote_number }], error: null };
        }
        if (name !== "create_sales_offer") return { error: new Error("RPC no simulada") };
        if (args.p_total_amount < args.p_subtotal) return { error: new Error("Offer totals are invalid") };
        const id = nextQuoteId++;
        opportunities.push({ id, customer_id: args.p_customer_id, title: args.p_title, service_mode: args.p_service_mode, estimated_revenue: args.p_total_amount, stage_id: 1, owner_id: "qa", updated_at: new Date().toISOString() });
        quotes.push({ id, quote_number: id, opportunity_id: id, customer_id: args.p_customer_id, title: args.p_title, notes: args.p_notes, service_mode: args.p_service_mode, currency_code: args.p_currency_code, subtotal: args.p_subtotal, total_amount: args.p_total_amount, status: "draft", updated_at: new Date().toISOString(), valid_until: args.p_valid_until });
        return { data: [{ quote_id: id, quote_number: id }], error: null };
      }
    }) };
  </script>
  <script src="../app-live.js"></script>
</body>
</html>
